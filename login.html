<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Solace Coffee House</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar navbar-expand-lg main-navbar">
    <div class="container">
        <a class="navbar-brand logo" href="index.html">SOLACE<span>.</span></a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navigation"
                aria-controls="navigation" aria-expanded="false"
                aria-label="Open navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navigation">
            <ul class="navbar-nav ms-auto align-items-lg-center">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                <li class="nav-item"><a class="nav-link" href="signup.html">Sign Up</a></li>
                <li class="nav-item"><a class="nav-link active" href="login.html">Log In</a></li>
            </ul>
        </div>
    </div>
</nav>

<main class="signup-section">
    <div class="signup-container">

        <p class="section-label">WELCOME BACK</p>
        <h2>Log In</h2>
        <p class="signup-description">
            Log in to continue your Solace Coffee House experience.
        </p>

        <form id="loginForm" novalidate>

            <div class="signup-field">
                <label for="loginEmail">Email Address</label>
                <input type="text" id="loginEmail" placeholder="Enter your email">
                <small class="error-message" id="loginEmailError"></small>
            </div>

            <div class="signup-field">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password">
                <small class="error-message" id="loginPasswordError"></small>
            </div>

            <button type="submit" class="btn-solace signup-button">
                Log In
            </button>

            <p class="form-message" id="loginMessage" aria-live="polite"></p>
        </form>

        <p class="text-center mt-3">
            Don't have an account?
            <a href="signup.html">Sign up</a>
        </p>

    </div>
</main>

<footer class="footer">
    <div class="container text-center">
        <p>© 2026 Solace Coffee House. All rights reserved.</p>
      <p>Team members:Aruzhan Imanmadiyeva,Ulzhan Askar</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>

</body>
</html>
